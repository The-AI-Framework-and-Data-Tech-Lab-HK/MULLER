[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muller"
dynamic = ["version"]
description = "MULLER: A Multimodal Data Lake Format for Collaborative AI Data Workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
    {name = "Xueling Lin", email = "heathersherrylin@gmail.com"},
    {name = "Bingyu Liu", email = "liubingyu62@gmail.com"}
]
dependencies = [
    "numpy>=1.24,<3",
    "pillow>=9.5.0",
    "pandas>=2.0,<3",
    "humbug>=0.3.1",
    "tqdm",
    "lz4",
    "dynaconf>=3.1.11",
    "psutil==5.9.8",
    "av<=12.3.0",
    "nibabel",
    "esdk-obs-python",
    "pathos",
    "wget",
    "filetype",
    "cryptography",
    "PyJWT",
    "pyarrow>=14,<23",
    "werkzeug",
    "jsonlines",
    "sortedcontainers",
    "jieba",
    "boto3>=1.26,<2",
    "redis>=4,<8",
    "cykhash",
    "mmh3",
    "pydantic>=2,<3",
    # faiss-cpu 1.10+ imports numpy._core and fails with diskannpy's NumPy 1.25 pin.
    "faiss-cpu==1.9.0.post1",
    "torch>=2.0,<3"
]

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "torchvision"
]
demo = [
    "streamlit>=1.30",
    "plotly"
]
# DISKANN is an optional vector index backend. The upstream diskannpy wheels
# are not available for macOS, and diskannpy 0.7.0 pins numpy==1.25, so keep it
# limited to Linux + Python 3.11. macOS users need to build DiskANN/diskannpy
# from source instead of installing this extra.
diskann = [
    "diskannpy==0.7.0; platform_system == 'Linux' and python_version == '3.11'"
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    "docs*",
    "scripts*",
    "thirdparty*",
    "*.build",
    "*.build.*",
    "build",
    "build.*"
]

[tool.setuptools.package-data]
"muller.util.sparsehash" = ["build/*.so", "*.so"]

[tool.setuptools.dynamic]
version = { attr = "muller._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests, deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["muller"]
branch = false
omit = [
    "muller/cli/*",
    "muller/util/sparsehash/*",
]

[tool.coverage.report]
# Baseline measured 2026-08-07 on CI scope (tests/unit + tests/security,
# -m "not slow"): ~36% line coverage. Floor is 35%; raise gradually.
# Do not lower without documenting why in the PR.
fail_under = 35
show_missing = false
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["thirdparty", "site", "sigmod_demo_revision", "exp_scripts"]

[tool.ruff.lint]
# First pass keeps the gate to correctness-level rules only (syntax errors,
# invalid prints/comparisons, undefined names) to avoid a repository-wide
# style diff. Tighten incrementally once the baseline is clean.
select = ["E9", "F63", "F7", "F82"]